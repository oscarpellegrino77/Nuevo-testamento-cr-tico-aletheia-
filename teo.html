<style>
:root{--bg:#eef1f4;--fg:#14202b;--card:#fff;--me:#0f5c63;--mef:#fff;--line:#c9d2da;--ac:#0f5c63;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f171d;--fg:#e6ecf1;--card:#18232c;--me:#2a8b94;--mef:#06191c;--line:#2b3a46;--ac:#6fc3cb;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.55 Georgia,"Times New Roman",serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:12px 16px;border-bottom:1px solid var(--line);font-size:19px;font-weight:bold}
#chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}
#chips button{flex:none;padding:6px 12px;border:1px solid var(--ac);border-radius:16px;background:none;color:var(--ac);font:inherit;font-size:15px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:10px 13px;border-radius:10px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--me);color:var(--mef);border-color:var(--me)}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#q{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
#go{padding:0 18px;border:0;border-radius:8px;background:var(--me);color:var(--mef);font:inherit;font-weight:bold}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;font-weight:normal;line-height:1.2}header b{font-size:20px}header small{opacity:.7;font-size:13px}#av{width:46px;height:46px;border-radius:12px}
.tiles{background:transparent;border:0;padding:4px 0;max-width:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-size:14px;padding:6px;white-space:normal}
.grid button.on{border-color:var(--ac);color:var(--ac);font-weight:bold}.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips2 button{padding:6px 11px;border:1px solid var(--ac);border-radius:16px;background:none;color:var(--ac);font:inherit;font-size:14px}
#vzb,#vzs{margin-left:auto;flex:none;min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-size:20px;line-height:1}#vzs{margin-left:0}#vzb+#vzs{margin-left:0}#vzs[hidden],#vzb[hidden]{display:none}
button{touch-action:manipulation}
.cal{width:100%;max-width:100%}.cal .calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal .calh button{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.cal .calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .calg span{padding:8px 0;border-radius:8px;border:1px solid transparent}
.cal .calg .wd{opacity:.7;font-size:13px;font-weight:bold}
.cal .calg .dom{color:var(--ac)}
.cal .calg .hoy{background:var(--me);color:var(--mef);font-weight:bold}
.cal .calf{margin-top:8px}.cal .calf button{min-height:40px;padding:6px 14px;border:1px solid var(--ac);border-radius:16px;background:none;color:var(--ac);font:inherit;font-size:14px}

<script>
// Para conectar tu Biblia: define window.BIBLIA_TEXTO = function(ref){ return "texto del pasaje" }
// El bot la usa en /ir y en /versiculos. Si no existe, muestra solo las citas.
var D=[
["depravacion","Depravación total",["total"],"El pecado alcanza a todo el ser humano: mente, voluntad y afectos. Sin la gracia nadie puede ni quiere venir a Cristo.","Ef 2:1-3; Ro 3:10-12; Jer 17:9; Jn 6:44; Ro 8:7-8","Si nadie puede, Dios no puede exigir.","La incapacidad es moral, no física: el hombre no quiere a Dios, y por eso es responsable."],
["eleccion","Elección incondicional",["predestinacion"],"Antes de la fundación del mundo Dios escogió por pura gracia a un pueblo en Cristo, sin mirar mérito ni fe prevista.","Ef 1:4-6; Ro 9:11-16; Hch 13:48; 2 Ts 2:13; 2 Ti 1:9","Dios elige según la fe que prevé (Ro 8:29).","“Conocer de antemano” es amor personal (Am 3:2), no previsión; y fuimos elegidos para ser santos, no porque lo seríamos (Ef 1:4)."],
["expiacion","Expiación limitada",["particular","redencion particular"],"Cristo murió con el propósito de salvar infaliblemente a su pueblo; su obra logra lo que se propone.","Jn 10:11, 15; Mt 1:21; Ef 5:25-27; Ro 8:32-34; Hch 20:28","Jn 3:16 y 1 Jn 2:2 hablan del mundo.","“Mundo” suele significar gente de toda nación (Ap 5:9). Y si la cruz pagó por todos, o todos se salvan o el pago quedó incompleto."],
["gracia-irresistible","Gracia irresistible",["llamado eficaz","irresistible"],"El Espíritu llama eficazmente a los elegidos y renueva su corazón, de modo que vienen a Cristo libre y gozosamente.","Jn 6:37, 44; Ro 8:30; Hch 16:14; Ef 2:4-5; 1 Co 1:23-24","Hch 7:51: resisten al Espíritu.","Por naturaleza resisten; la gracia eficaz vence esa resistencia cambiando el corazón (Ez 36:26), no forzando la voluntad."],
["perseverancia","Perseverancia de los santos",["perseverancia de los santos"],"Dios guarda a los suyos hasta el fin: los verdaderamente salvos perseveran porque Él los sostiene.","Jn 10:28-29; Fil 1:6; Ro 8:38-39; 1 P 1:5; Jud 24","Heb 6:4-6 advierte contra la apostasía.","Las advertencias son medios con que Dios guarda a los suyos; quien cae del todo muestra que no era de ellos (1 Jn 2:19)."],
["sola-scriptura","Sola Scriptura",["solo la escritura","sola escritura"],"La Escritura es la única regla infalible de fe y vida; la tradición y la iglesia quedan sujetas a ella.","2 Ti 3:16-17; Hch 17:11; 2 P 1:20-21; Mt 15:3-9; Is 8:20","La Biblia no dice que sea la única autoridad.","Cristo y los apóstoles apelan a lo escrito como tribunal final (Mt 4:4). Sola Scriptura no niega la tradición: la subordina."],
["sola-gratia","Sola gratia",["sola gracia"],"La salvación es obra de Dios de principio a fin; nada del pecador la merece ni la completa.","Ef 2:8-9; Ro 11:6; Tit 3:4-7; 2 Ti 1:9","Entonces la gracia produce pasividad.","La gracia que justifica también santifica (Tit 2:11-12): la obediencia es fruto, no precio."],
["sola-fide","Sola fide",["sola fe"],"Dios declara justo al pecador solo por la fe en Cristo, aparte de las obras de la ley.","Ro 3:28; Ro 5:1; Gá 2:16; Fil 3:9; Ro 4:4-5","Stg 2:24 dice que se justifica por obras.","Santiago habla de la fe viva que se muestra ante los hombres; Pablo, de cómo es declarado justo el impío ante Dios. La fe que justifica nunca está sola, pero solo la fe justifica."],
["solus-christus","Solus Christus",["solo cristo"],"Cristo es el único mediador y el único camino de salvación.","Hch 4:12; 1 Ti 2:5; Jn 14:6; Heb 7:25","Es una afirmación intolerante.","La exclusividad es del propio Cristo (Jn 14:6); la invitación, en cambio, es para todos (Mt 11:28)."],
["soli-deo-gloria","Soli Deo gloria",["gloria de dios"],"Todo, la creación, la redención y la vida del creyente, existe para la gloria de Dios.","Ro 11:36; 1 Co 10:31; Is 48:11; Ef 1:12","Un Dios que busca su gloria es egocéntrico.","Dios es el bien supremo: llamar a las criaturas a su gloria es llamarlas a lo único que las satisface (Sal 16:11)."],
["justificacion","Justificación",[],"Acto legal de Dios por el cual perdona los pecados y declara justo al creyente, atribuyéndole la justicia de Cristo.","Ro 4:5-8; Ro 5:1, 18-19; 2 Co 5:21; Ro 8:33-34","Es una ficción legal.","Es real porque Cristo, unido a los suyos, cumplió la ley y cargó la pena; Dios no declara justo sin base justa (Ro 3:26)."],
["santificacion","Santificación",[],"Obra del Espíritu que conforma al creyente a la imagen de Cristo; es progresiva y no termina en esta vida.","1 Ts 4:3; Fil 2:12-13; Heb 12:14; 2 Co 3:18; Ro 6:19","Si todo es gracia, no hace falta esforzarse.","Dios produce en nosotros el querer y el hacer (Fil 2:13), por eso Pablo manda esforzarse (2:12)."],
["adopcion","Adopción",[],"Dios recibe al creyente como hijo, con los derechos y el cuidado de su familia.","Ro 8:15-17; Gá 4:4-7; Ef 1:5; 1 Jn 3:1","Todos somos hijos de Dios por creación.","Todos son criaturas; solo en Cristo se es hijo y heredero (Jn 1:12)."],
["providencia","Providencia",[],"Dios sostiene y gobierna toda la creación y todos los acontecimientos para sus fines, sin ser autor del pecado.","Ro 8:28; Ef 1:11; Pr 16:9; Mt 10:29-31; Heb 1:3","Si Dios lo gobierna todo, es autor del mal.","Gn 50:20: ellos lo planearon para mal y Dios para bien. Westminster (3.1) afirma que Dios lo ordena todo sin ser autor del pecado."],
["soberania","Soberanía de Dios",["soberania de dios"],"Dios reina sobre todo y hace conforme a su voluntad; nada ocurre fuera de su propósito.","Sal 115:3; Is 46:10; Dn 4:34-35; Pr 21:1; Ef 1:11","Anula la responsabilidad humana.","La Biblia afirma ambas cosas (Hch 2:23): entregado por el plan de Dios, y los hombres lo mataron. El misterio no se resuelve negando un lado."],
["pacto","Teología del pacto",["pactos","teologia del pacto"],"Dios se relaciona con su pueblo por pactos: obras en Adán, gracia en Cristo; el nuevo pacto cumple y supera al antiguo.","Gn 3:15; Gn 17:7; Jer 31:31-34; Heb 8:6-13; Lc 22:20","El pacto de obras no aparece en la Biblia.","Según la lectura reformada, Os 6:7 y Ro 5:12-19 presentan a Adán como representante; el término es posterior, la estructura es bíblica."],
["trinidad","Trinidad",[],"Un solo Dios en tres personas, Padre, Hijo y Espíritu Santo, de la misma esencia e iguales en gloria.","Dt 6:4; Mt 28:19; 2 Co 13:14; Jn 1:1-3; Hch 5:3-4","La palabra no está en la Biblia.","El término es de la iglesia; la realidad está en los textos: un solo Dios y tres que reciben el mismo nombre, culto y atributos."],
["cristo","Las dos naturalezas de Cristo",["calcedonia","cristologia","naturalezas"],"Cristo es una persona con dos naturalezas, plenamente Dios y plenamente hombre, sin mezcla ni confusión (Calcedonia, 451).","Jn 1:1, 14; Fil 2:6-8; Col 2:9; Heb 4:15; Ro 9:5","Si es Dios, no pudo ser tentado ni morir.","Fue tentado y murió según su humanidad; la unión de las naturalezas da valor infinito a su obra."],
["imputacion","Imputación",[],"Dios carga el pecado de su pueblo a Cristo y acredita la justicia de Cristo al creyente.","2 Co 5:21; Ro 5:18-19; Fil 3:9; Is 53:6; Ro 4:6","Un inocente no puede pagar por culpables.","Cristo asumió voluntariamente esa representación, como Adán la tuvo para los suyos (Ro 5:19)."],
["regeneracion","Regeneración",["nuevo nacimiento"],"Nuevo nacimiento: Dios da vida espiritual por el Espíritu, antes de la fe y como su base.","Jn 3:3-8; Ez 36:26-27; Tit 3:5; 1 P 1:3; Ef 2:4-5","La fe precede al nuevo nacimiento.","Los muertos en delitos no creen hasta ser vivificados (Ef 2:5); 1 Jn 5:1 dice que quien cree ha nacido (en perfecto) de Dios."],
["iglesia","La iglesia",["eclesiologia"],"Pueblo de Dios reunido por la Palabra y los sacramentos bajo Cristo, su cabeza; sus marcas son la predicación fiel, los sacramentos y la disciplina.","Mt 16:18; Ef 4:11-16; Hch 2:42; Mt 18:15-20; Heb 10:24-25","Se puede ser cristiano sin iglesia.","Heb 10:25 manda no abandonar la congregación, y los apóstoles establecen ancianos en cada iglesia (Hch 14:23; Tit 1:5)."],
["sacramentos","Sacramentos",["bautismo","cena"],"Bautismo y Cena del Señor son señales y sellos del pacto; la gracia llega por la fe, no por el rito en sí.","Mt 28:19; 1 Co 11:23-26; Ro 6:3-4; Hch 2:38-39; 1 Co 10:16","Los reformados discrepan sobre el bautismo.","Es un debate interno: paidobautistas (Westminster) y bautistas (1689) coinciden en la autoridad de la Escritura y difieren en el sujeto del bautismo."],
["ley","La ley de Dios",["ley moral","decalogo"],"La ley moral, resumida en los Diez Mandamientos, revela el pecado, restringe el mal y guía al creyente.","Ro 3:20; Gá 3:24; Mt 5:17-19; Ro 7:12; Sal 119:97","Estamos bajo la gracia, no bajo la ley.","Ro 6:14 habla de la ley como camino de justificación; Cristo no vino a abolirla sino a cumplirla (Mt 5:17)."],
["libre-albedrio","Voluntad esclava",["libre albedrio","libertad de la voluntad"],"El hombre elige lo que desea, pero su deseo está sujeto a su naturaleza caída; sin gracia es esclavo del pecado.","Jn 8:34; Ro 6:16-20; Ro 8:7-8; Jn 6:44, 65; 2 Ti 2:25-26","Sin libertad de escoger no hay responsabilidad moral.","Hay libertad de elegir lo que se quiere, no de querer otra cosa. Así lo defendieron Lutero y Edwards."],
["adoracion","Principio regulativo",["culto","principio regulativo"],"Dios prescribe en su Palabra cómo quiere ser adorado; el culto se limita a lo que la Escritura ordena.","Dt 12:32; Lv 10:1-3; Jn 4:23-24; Col 2:20-23","Lo que la Biblia no prohíbe está permitido.","Otros reformados sostienen el principio normativo; es un debate interno. Los regulativistas apelan a Nadab y Abiú (Lv 10:1-3)."],
["inspiracion","Inspiración e inerrancia",["inerrancia"],"La Escritura es palabra de Dios, inspirada en cada parte y sin error en lo que afirma.","2 Ti 3:16; 2 P 1:20-21; Mt 5:18; Jn 10:35","Los autores humanos introducen errores.","Dios usó autores reales con su propio estilo sin que su palabra errara (2 P 1:21); Cristo trató lo escrito como inquebrantable (Jn 10:35)."],
["canon","El canon",["canon biblico"],"Los 66 libros son la regla fija de la fe; la iglesia los reconoció, no los creó.","Lc 24:44; 2 P 3:15-16; Jud 3; Ro 3:2","La iglesia decidió el canon, así que está sobre él.","Los libros tenían autoridad por ser de Dios; la iglesia los reconoció como las ovejas reconocen la voz del pastor (Jn 10:27)."],
["creacion","Creación",[],"Dios creó de la nada todo lo que existe, por su Palabra y para su gloria.","Gn 1:1; Sal 33:6-9; Col 1:16; Heb 11:3","La ciencia contradice Génesis.","Los reformados discrepan en cómo leer los días de Gn 1; coinciden en que Dios creó por su palabra y es el Señor de lo creado."],
["imagen-de-dios","Imagen de Dios",["imago dei","imagen"],"El hombre fue creado a imagen de Dios: razón, moral y capacidad de relación con Él; el pecado la dañó sin borrarla.","Gn 1:26-27; Sal 8:5; Stg 3:9; Col 3:10","Si el pecado la destruyó, ya no hay dignidad.","Tras la caída Dios sigue viendo al hombre como portador de su imagen (Gn 9:6; Stg 3:9); en Cristo se renueva (Col 3:10)."],
["caida","La caída",["adan"],"Adán, cabeza del género humano, desobedeció a Dios; su pecado trajo culpa, corrupción y muerte a todos.","Gn 3:1-19; Ro 5:12; 1 Co 15:21-22","Es injusto pagar por Adán.","Ro 5:12-19 usa la misma lógica de representación para la salvación: quien niega al primer Adán pierde también al segundo."],
["pecado-original","Pecado original",["pecado heredado"],"Todos nacen con culpa y corrupción heredadas de Adán, antes de cualquier acto propio.","Sal 51:5; Ro 5:12-19; Ef 2:3; Job 14:4","Los niños nacen inocentes.","Sal 51:5 y Ef 2:3 hablan de una naturaleza pecaminosa desde el origen; por eso también ellos necesitan a Cristo."],
["gracia-comun","Gracia común",[],"Dios concede a todos bondad que no salva: lluvia, orden social, conciencia, artes, freno al pecado.","Mt 5:45; Hch 14:17; Gn 9:1-17; Ro 2:14-15","Si todos son depravados, ¿cómo hacen el bien?","La gracia común restringe el pecado sin regenerar: explica el bien civil de los incrédulos sin hacerlos salvos."],
["atributos","Atributos de Dios",["perfecciones"],"Dios es eterno, inmutable, omnipotente, omnisciente, omnipresente, santo, justo, bueno y verdadero.","Éx 34:6-7; Sal 90:2; Sal 139:7-12; Mal 3:6; Is 40:28","Un Dios inmutable no puede relacionarse con nosotros.","Es inmutable su carácter y propósito, no su cercanía: se relaciona con el mundo sin cambiar (Nm 23:19; Stg 1:17)."],
["santidad","Santidad de Dios",["santo"],"Dios es separado de toda impureza y absolutamente puro; su santidad funda su llamado a los suyos.","Is 6:3; Lv 11:44; 1 P 1:15-16; Hab 1:13","Un Dios santo no puede acercarse a pecadores.","Por eso hace falta mediador: en Cristo el Dios santo recibe a los suyos (Heb 10:19-22)."],
["ira","Ira de Dios",[],"La ira de Dios es su justa reacción contra el pecado: el lado de su santidad, no un capricho.","Ro 1:18; Nah 1:2-3; Jn 3:36; Ro 5:9","Un Dios de amor no puede airarse.","Un Dios que no se aira ante el mal no sería bueno; su amor se muestra en que Cristo cargó esa ira (Ro 5:8-9)."],
["propiciacion","Propiciación",[],"Cristo, con su sangre, apartó la ira de Dios contra su pueblo y satisfizo su justicia.","Ro 3:25; 1 Jn 4:10; Heb 2:17; 1 Jn 2:2","Es mejor entenderla solo como borrar el pecado.","Los reformados sostienen que el término incluye apartar la ira; en Ro 3:25 va unido a la sangre y a la justicia de Dios."],
["sustitucion","Sustitución penal",["sustitucion penal"],"Cristo cargó en la cruz la pena que merecían los pecadores, en su lugar.","Is 53:5-6; 1 P 2:24; Gá 3:13; 2 Co 5:21","Es violencia del Padre contra el Hijo.","El Hijo se entregó voluntariamente y en unidad con el Padre (Jn 10:18; Ef 5:2): es Dios cargando su propio juicio."],
["resurreccion","Resurrección de Cristo",["resurreccion de cristo"],"Cristo resucitó corporalmente al tercer día: prueba de su victoria y de nuestra justificación.","1 Co 15:3-8, 17; Ro 4:25; Mt 28:6; Hch 2:24","Fue una resurrección solo espiritual.","La tumba vacía y las apariciones (Lc 24:39-43; 1 Co 15:4-8) muestran un cuerpo real; sin eso, dice Pablo, la fe es vana (1 Co 15:17)."],
["ascension","Ascensión y sesión",["sesion"],"Cristo subió al cielo y está sentado a la diestra del Padre: reina e intercede por los suyos.","Hch 1:9-11; Heb 1:3; Ef 1:20-22; Ro 8:34","Si se fue, estamos abandonados.","Está presente por su Espíritu (Jn 16:7; Mt 28:20); su ascensión es la base de su reinado e intercesión."],
["triple-oficio","Profeta, sacerdote y rey",["triple oficio","oficios de cristo"],"Cristo cumple tres oficios: profeta que revela, sacerdote que ofrece y rey que gobierna.","Dt 18:15; Heb 4:14-15; Sal 2:6; Hch 3:22","Es una división artificial.","Es una clasificación útil, no una división de Cristo: las tres funciones se cumplen en una sola persona (Heb 1:1-3)."],
["union","Unión con Cristo",["union con cristo"],"El creyente está unido a Cristo por el Espíritu y la fe; de esa unión fluyen todos los beneficios de la salvación.","Ro 6:5; Gá 2:20; Jn 15:4-5; Ef 1:3","Es solo una metáfora.","Pablo habla de morir y resucitar con Cristo como realidad presente (Ro 6:3-5; Col 3:1), no solo como imagen."],
["fe","Fe salvadora",["fe salvadora"],"Confianza personal en Cristo, con conocimiento, asentimiento y descanso en Él; es don de Dios.","Ef 2:8; Heb 11:1; Ro 10:17; Jn 1:12","La fe es una obra del hombre.","La fe recibe, no merece: es el instrumento, no la causa, de la justificación (Ro 4:16)."],
["arrepentimiento","Arrepentimiento",[],"Cambio de mente y de rumbo: dolor por el pecado y vuelta a Dios, junto con la fe.","Hch 3:19; 2 Co 7:10; Lc 13:3; Hch 20:21","Es una obra previa que merece perdón.","Acompaña a la fe y, como ella, es don (Hch 11:18; 2 Ti 2:25), no mérito."],
["seguridad","Seguridad de la salvación",["certeza"],"El creyente puede saber con certeza que está en gracia, por la promesa de Dios y el testimonio del Espíritu.","Ro 8:16; 1 Jn 5:13; 2 P 1:10; Heb 10:22","Es presunción.","La seguridad descansa en las promesas de Dios, no en uno mismo, y se examina por sus frutos (2 P 1:10)."],
["glorificacion","Glorificación",[],"Culminación de la salvación: Dios transforma al creyente, cuerpo y alma, a imagen de Cristo, libre de pecado.","Ro 8:30; Fil 3:20-21; 1 Co 15:51-53; 1 Jn 3:2","Es solo un estado lejano e incierto.","Ro 8:30 la pone en pasado, como ya segura en el propósito de Dios."],
["espiritu-santo","El Espíritu Santo",["espiritu santo","pneumatologia"],"Persona divina que regenera, habita en el creyente, lo santifica y lo ilumina en la Palabra.","Jn 16:13-14; Ro 8:9-11; Gá 5:22-23; 1 Co 12:7","¿Continúan los dones milagrosos?","Es debate interno entre reformados (continuistas y cesacionistas); coinciden en que el Espíritu obra con la Palabra, nunca contra ella."],
["oracion","Oración",[],"Hablar con Dios por medio de Cristo: adoración, confesión, gratitud y petición según su voluntad.","Mt 6:9-13; Fil 4:6; 1 Jn 5:14; Ro 8:26","Si Dios lo decretó todo, orar no cambia nada.","Dios ordena los fines y los medios: la oración es el medio por el que da lo que decretó (Stg 4:2; Mt 7:7)."],
["reposo","Día de reposo",["sabado","domingo","dia del señor"],"Dios apartó un día de cada siete para descanso y culto; los reformados lo ven vigente, con el domingo como día del Señor.","Éx 20:8-11; Mc 2:27; Heb 4:9-10; Is 58:13-14","Col 2:16 libera de guardar días.","Los sabatarianos distinguen lo ceremonial de lo moral; otros reformados ven el domingo como libertad cristiana. Es debate interno."],
["predicacion","Predicación",["sermon"],"La predicación fiel de la Palabra es el medio ordinario por el que Dios salva y edifica.","2 Ti 4:2; Ro 10:14-17; 1 Co 1:21; Neh 8:8","Hoy bastan los testimonios y la música.","Dios escogió la Palabra predicada (Ro 10:17; 1 Co 1:21); lo demás sirve, no sustituye."],
["disciplina","Disciplina eclesial",[],"La iglesia corrige al que persiste en pecado, buscando su restauración y la pureza del cuerpo.","Mt 18:15-17; 1 Co 5:1-13; Tit 3:10; 2 Co 2:6-8","Juzgar a otros es intolerancia.","Mt 7:1 condena el juicio hipócrita; Cristo mismo ordena el proceso de Mt 18, y su fin es la restauración (Gá 6:1)."],
["gobierno","Gobierno de la iglesia",["presbiterio","ancianos"],"La iglesia es gobernada por ancianos y diáconos bajo Cristo; los reformados difieren en la forma (presbiteriana o congregacional).","Tit 1:5; Hch 14:23; 1 Ti 3:1-13; 1 P 5:1-3","El Nuevo Testamento no fija un modelo.","Es debate interno: todos coinciden en ancianos y diáconos y difieren en cómo se relacionan las iglesias entre sí."],
["vocacion","Vocación",["trabajo"],"Todo trabajo lícito es llamado de Dios: se le sirve a Él y al prójimo también fuera del templo.","1 Co 7:20; Col 3:23-24; Gn 2:15; Ef 2:10","Lo espiritual es solo lo religioso.","Dios puso a Adán a trabajar antes de la caída (Gn 2:15); Colosenses manda hacerlo todo para el Señor (3:23)."],
["magistrado","Autoridad civil",["gobierno civil","estado"],"Dios instituyó la autoridad civil para castigar el mal y premiar el bien; se le debe obediencia salvo ante lo que Dios prohíbe.","Ro 13:1-7; 1 P 2:13-17; Hch 5:29; Mt 22:21","Ro 13 y Hch 5:29 se contradicen.","Se equilibran: la autoridad viene de Dios, y por eso su mandato no puede ir contra el de Dios (Hch 5:29)."]
];
var T=D.map(function(d){return{id:d[0],n:d[1],a:d[2],r:d[3],v:d[4].split("; "),o:d[5],x:d[6]}});
var log=document.getElementById("log"),q=document.getElementById("q");
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function say(x,u){var d=document.createElement("div");d.className="m"+(u?" u":"");d.textContent=x;log.appendChild(d);log.scrollTop=log.scrollHeight}
function find(s){s=norm(s);if(!s)return null;return T.find(function(t){return t.id==s||norm(t.n)==s||t.a.some(function(a){return norm(a)==s})})||T.find(function(t){return t.id.indexOf(s)>-1||norm(t.n).indexOf(s)>-1})||null}
function vt(r){try{return typeof window.BIBLIA_TEXTO==="function"?window.BIBLIA_TEXTO(r):null}catch(e){return null}}
function refs(t){return t.v.map(function(r){var x=vt(r);return "• "+r+(x?"\n  "+x:"")}).join("\n")}
function full(t){return t.n+"\n\n"+t.r+"\n\nVersículos:\n"+refs(t)+"\n\nObjeción: "+t.o+"\nRespuesta: "+t.x}
function pick(a,f){var t=find(a);return t?f(t):"No encuentro ese tema. Escribe /lista."}
var C={
ayuda:function(){return "Comandos generales:\n/lista · /buscar palabra · /azar · /puntos · /solas · /confesiones · /ir cita · /total · /limpiar\n\nPor tema:\n/tema (completo) · /resumen tema · /versiculos tema · /objecion tema\n\nCada tema es también un comando: /eleccion, /sola-fide, /pacto… Escribe /lista para verlos."},
lista:function(){return T.map(function(t){return "/"+t.id+" — "+t.n}).join("\n")},
buscar:function(a){var s=norm(a);if(!s)return "Escribe /buscar seguido de una palabra.";var h=T.filter(function(t){return norm([t.n,t.r,t.o,t.x,t.v.join(" ")].join(" ")).indexOf(s)>-1});return h.length?h.length+" resultado(s):\n"+h.map(function(t){return "/"+t.id+" — "+t.n}).join("\n"):"Sin resultados para “"+a+"”."},
azar:function(){return full(T[Math.floor(Math.random()*T.length)])},
solas:function(){return ["sola-scriptura","sola-gratia","sola-fide","solus-christus","soli-deo-gloria"].map(function(i){var t=find(i);return t.n+"\n"+t.r}).join("\n\n")},
confesiones:function(){return "Confesión Belga (1561)\nCatecismo de Heidelberg (1563)\nSegunda Confesión Helvética (1566)\nCánones de Dort (1619)\nConfesión de Westminster (1646), con sus Catecismos Mayor y Menor\nConfesión Bautista de 1689"},
ir:function(a){if(!a)return "Escribe /ir seguido de una cita. Ejemplo: /ir Jn 3:16";var x=vt(a);return x?a+"\n"+x:"Para leer el pasaje, conecta tu Biblia definiendo window.BIBLIA_TEXTO."},
doctrina:function(a){return pick(a,full)},
resumen:function(a){return pick(a,function(t){return t.n+": "+t.r})},
versiculos:function(a){return pick(a,function(t){return t.n+"\n"+refs(t)})},
objecion:function(a){return pick(a,function(t){return t.n+"\nObjeción: "+t.o+"\nRespuesta: "+t.x})},
total:function(){var g=Object.keys(C).length-4;return T.length+" temas × 4 comandos + "+g+" generales = "+(T.length*4+g)+" comandos."},
limpiar:function(){log.innerHTML="";return "Listo. Escribe /ayuda."}
};
function run(txt){txt=txt.trim();if(!txt)return;say(txt,1);var s=txt.replace(/^\//,""),i=s.search(/\s/),c=norm(i<0?s:s.slice(0,i)),a=i<0?"":s.slice(i+1).trim();
if(Object.prototype.hasOwnProperty.call(C,c)){var r=C[c](a);if(c!=="limpiar")say(r);else{log.innerHTML="";say(r)}return}
var t=find(s)||find(c);if(t)return say(full(t));say("No reconozco “"+c+"”. Escribe /ayuda o /lista.")}
document.getElementById("go").onclick=function(){run(q.value);q.value="";q.focus()};
q.onkeydown=function(e){if(e.key==="Enter"){run(q.value);q.value=""}};
var ch=document.getElementById("chips");
["/ayuda","/lista","/puntos","/solas","/azar","/confesiones"].forEach(function(c){var b=document.createElement("button");b.textContent=c;b.onclick=function(){run(c)};ch.appendChild(b)});
</script>
<script>
var S={};try{S=JSON.parse(localStorage.getItem("btr"))||{}}catch(e){}
S.f=S.f||[];S.v=S.v||[];if(S.c==null)S.c=-1;
function sv(){try{localStorage.setItem("btr",JSON.stringify(S))}catch(e){}}
function nm(){return S.n?", "+S.n:""}
function sal(){var h=new Date().getHours();return h<6||h>=20?"Buenas noches":h<12?"Buenos días":"Buenas tardes"}
function dn(o){var d=new Date();d.setDate(d.getDate()+o);return d}
function di(d){return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)}
function rnd(){return T[Math.floor(Math.random()*T.length)]}
function fx(s){return T.find(function(t){return t.id==s||norm(t.n)==s||t.a.some(function(a){return norm(a)==s})})}
var PR=["Señor, graba esta verdad en mi corazón y que se note en cómo vivo hoy. Amén.","Padre, dame fe para creerla y obediencia para vivirla. Amén.","Dios, no me dejes oírla sin que me cambie. Amén.","Cristo, que esta verdad me acerque más a ti y a los que tengo cerca. Amén.","Espíritu Santo, ilumina mi mente y mueve mi corazón. Amén."];
var PM=["Is 41:10 — Dios está contigo: no temas.","Jos 1:9 — El Señor va contigo adonde vayas.","Sal 23:1 — El Señor es tu pastor; nada te faltará.","Mt 28:20 — Cristo está contigo todos los días.","Ro 8:28 — Dios hace que todo coopere para bien de los que le aman.","Fil 4:19 — Dios suplirá lo que te falte.","Jn 14:27 — Cristo te deja su paz."];
var DS=["Agradece a Dios por tres cosas concretas.","Escribe a alguien para animarlo.","Lee un salmo completo en voz alta.","Perdona algo que tienes pendiente.","Ora por alguien que te cuesta.","Cuéntale a alguien una verdad que aprendiste.","Haz un servicio en silencio, sin que lo sepan."];
var CF=["Confesión Belga (1561)","Catecismo de Heidelberg (1563)","Segunda Confesión Helvética (1566)","Cánones de Dort (1619)","Confesión de Westminster (1646)","Confesión Bautista de 1689"];
var _f=full;full=function(t){S.c=T.indexOf(t);if(S.v.indexOf(t.id)<0){S.v.push(t.id);sv()}return _f(t)};
function dev(o){var d=dn(o||0),n=di(d),t=T[n%T.length];S.c=T.indexOf(t);return "Devocional · "+d.toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})+"\n\n"+t.n+"\n\n"+t.r+"\n\nLee:\n"+refs(t)+"\n\nPara pensar: "+t.o+" "+t.x+"\n\nOración: "+PR[n%5]}
function p(l,r){return function(){return l+"\n\n"+r.split("; ").map(function(x){var t=vt(x);return "• "+x+(t?"\n  "+t:"")}).join("\n")}}
function on(f){return function(){var t=S.c>=0?T[S.c]:null;return t?f(t):"Primero abre un tema, por ejemplo /eleccion, o escribe /empezar."}}

["mi puntaje|puntaje|mejor puntaje|mis puntos de juego|record de juegos",function(){return "Tu puntaje de juegos: "+(S.jp||0)+" puntos en "+(S.jn||0)+" ronda(s). Mejor ronda: "+(S.jb||0)+" de "+RONDA+".\nPara jugar: /juego"}],

/* ---- Libros de la Biblia (41) ---- */
E("genesis|libro de genesis","Génesis es el libro de los comienzos: la creación, la caída, el diluvio, Babel y el llamado de Abraham. Desde Gn 3:15 Dios promete un Redentor.","Gn 1:1; Gn 3:15; Gn 12:1-3; Gn 50:20"),
E("exodo|libro de exodo","Éxodo: Dios libera a Israel de Egipto con la Pascua, entrega la ley en el Sinaí y habita en medio de su pueblo en el tabernáculo.","Ex 12:1-14; Ex 14:13-14; Ex 20:1-17; Ex 40:34-35"),
E("levitico|libro de levitico","Levítico enseña cómo se acerca un pueblo pecador a un Dios santo: sacrificios, sacerdocio, pureza y el Día de la Expiación. Todo apunta a Cristo.","Lv 16:29-30; Lv 17:11; Lv 19:2; Heb 9:11-14"),
E("numeros|libro de numeros","Números: la marcha de Israel por el desierto. Por su incredulidad, la generación del éxodo no entra a la tierra, pero Dios sigue siendo fiel.","Nm 14:1-35; Nm 21:4-9; Nm 23:19; Jn 3:14-15"),
E("deuteronomio|libro de deuteronomio","Deuteronomio: Moisés renueva el pacto antes de que Israel entre a la tierra. Llamado central: amar a Dios con todo el ser y obedecerle.","Dt 6:4-9; Dt 8:2-3; Dt 30:19-20; Mt 4:4"),
E("libro de josue|josue","Josué: Dios cumple su promesa y da la tierra. Israel entra bajo el mando de Josué y renueva su compromiso de servir al Señor.","Jos 1:5-9; Jos 6:1-20; Jos 21:43-45; Jos 24:15"),
E("libro de jueces|jueces","Jueces: un ciclo repetido de pecado, opresión, clamor y liberación. El pueblo hace lo que le parece bien y se espera un rey.","Jue 2:16-19; Jue 6:11-16; Jue 21:25"),
E("libro de rut|rut","Rut: una extranjera fiel entra al pueblo de Dios. Booz actúa como redentor, y de esta familia vendrá David y, finalmente, Cristo.","Rt 1:16-17; Rt 4:13-22; Mt 1:5"),
E("libro de samuel|samuel|libros de samuel","Samuel: Dios levanta a Samuel, Israel pide un rey, Saúl falla y Dios escoge a David, a quien promete una casa y un trono eternos.","1 S 3:1-21; 1 S 16:7; 2 S 7:12-16"),
E("libro de reyes|reyes de israel y de juda","Reyes: la gloria de Salomón, la división del reino, la idolatría y el exilio. Los profetas llaman al pueblo a volver al pacto.","1 R 8:22-30; 1 R 12:16-20; 2 R 17:6-18; 2 R 25:1-21"),
E("esdras y nehemias|libro de esdras|libro de nehemias|nehemias|esdras","Esdras y Nehemías: un remanente regresa del exilio, se reconstruyen el templo y la muralla, y el pueblo vuelve a escuchar la Ley.","Esd 1:1-4; Neh 6:15-16; Neh 8:1-8"),
E("libro de ester|reina ester","Ester: el nombre de Dios no aparece, pero su providencia lo gobierna todo. Una joven judía arriesga su vida y su pueblo se salva.","Est 4:14-16; Est 9:20-22"),
E("libro de los salmos|salmos|libro de salmos","Salmos: la oración y el canto del pueblo de Dios. Hay alabanza, lamento y arrepentimiento, y muchos salmos apuntan a Cristo.","Sal 1:1-3; Sal 22:1-31; Sal 51:1-17; Sal 110:1"),
E("proverbios|libro de proverbios","Proverbios: sabiduría práctica que empieza con el temor del Señor. Enseña sobre las palabras, el trabajo, el dinero y la familia.","Pr 1:7; Pr 3:5-6; Pr 15:1; Pr 16:3"),
E("eclesiastes|libro de eclesiastes","Eclesiastés: todo lo que hay bajo el sol es pasajero si se vive sin Dios. La conclusión es temer a Dios y guardar sus mandamientos.","Ec 1:2; Ec 3:1-8; Ec 12:13-14"),
E("cantares|cantar de los cantares","Cantares: un poema que celebra el amor matrimonial como regalo de Dios. La iglesia también ha visto en él un reflejo del amor de Cristo.","Cnt 2:16; Cnt 8:6-7; Ef 5:31-32"),
E("libro de isaias|isaias|profeta isaias","Isaías: juicio sobre el pecado y consuelo para el pueblo. Anuncia al Siervo sufriente que carga con nuestras culpas.","Is 6:1-8; Is 7:14; Is 9:6; Is 53:4-6"),
E("libro de jeremias|jeremias|profeta jeremias","Jeremías: el profeta que llora anuncia el exilio y promete un nuevo pacto, con la ley escrita en el corazón.","Jer 17:9; Jer 29:11-14; Jer 31:31-34"),
E("libro de ezequiel|ezequiel|profeta ezequiel","Ezequiel: desde el exilio ve la gloria de Dios y promete un corazón nuevo y el Espíritu. Los huesos secos vuelven a vivir.","Ez 34:11-16; Ez 36:26-27; Ez 37:1-14"),
E("libro de daniel|daniel|profeta daniel","Daniel: fidelidad en Babilonia. Dios gobierna sobre los reyes y promete un reino eterno al Hijo del Hombre.","Dn 3:16-18; Dn 6:10-23; Dn 7:13-14"),
E("profetas menores|los doce profetas","Los doce profetas menores, de Oseas a Malaquías, denuncian el pecado, anuncian juicio y prometen restauración y la venida del Mesías.","Os 11:8-9; Jl 2:28-29; Mi 5:2; Mal 3:1"),
E("libro de mateo|evangelio de mateo|mateo","Mateo presenta a Jesús como el Rey y Mesías prometido, cumplimiento del Antiguo Testamento. Incluye el Sermón del Monte y termina con la Gran Comisión.","Mt 1:1; Mt 5:1-12; Mt 28:18-20"),
E("libro de marcos|evangelio de marcos|evangelio de marco|marcos","Marcos es el Evangelio más breve y veloz. Muestra al Siervo que da su vida en rescate por muchos.","Mc 1:1; Mc 10:45; Mc 15:39"),
E("libro de lucas|evangelio de lucas|lucas","Lucas presenta a Jesús como Salvador de todos. Destaca a los pobres, las mujeres y los pecadores, y relata las parábolas de la misericordia.","Lc 1:1-4; Lc 15:1-32; Lc 19:10"),
E("evangelio de juan|libro de juan","Juan fue escrito para que creas que Jesús es el Cristo, el Hijo de Dios, y tengas vida en su nombre. Contiene los siete «Yo soy».","Jn 1:1-14; Jn 20:30-31; Jn 10:11"),
E("libro de hechos|hechos de los apostoles","Hechos: el Espíritu viene en Pentecostés y el evangelio avanza de Jerusalén hasta los confines de la tierra, por medio de Pedro y Pablo.","Hch 1:8; Hch 2:1-41; Hch 17:11"),
E("libro de romanos|carta a los romanos|romanos","Romanos es la carta que mejor explica el evangelio: todos pecaron, somos justificados por la fe y vivimos en el Espíritu.","Ro 1:16-17; Ro 3:23-24; Ro 5:1; Ro 8:1"),
E("cartas a los corintios|libro de corintios|corintios","Corintios: Pablo corrige divisiones, pleitos y desórdenes en la iglesia; habla de la Cena, de los dones, del amor y de la resurrección.","1 Co 1:10; 1 Co 13:1-13; 1 Co 15:3-4; 2 Co 5:17-21"),
E("carta a los galatas|libro de galatas|galatas","Gálatas: la salvación es por gracia mediante la fe, no por las obras de la ley. Defiende el evangelio de la libertad.","Gá 2:16; Gá 3:11; Gá 5:1; Gá 5:22-23"),
E("carta a los efesios|libro de efesios|efesios","Efesios: salvos por gracia, unidos en un solo cuerpo y llamados a vivir de manera digna. Termina con la armadura de Dios.","Ef 2:8-10; Ef 4:1-6; Ef 6:10-18"),
E("carta a los filipenses|libro de filipenses|filipenses","Filipenses: carta de gozo escrita desde la cárcel. Cristo se humilló, y por eso vivimos con humildad y contentamiento.","Fil 2:5-11; Fil 4:4-7; Fil 4:11-13"),
E("carta a los colosenses|libro de colosenses|colosenses","Colosenses: Cristo es supremo sobre toda la creación y suficiente para su iglesia; los que están en él viven una vida nueva.","Col 1:15-20; Col 2:9-10; Col 3:1-4"),
E("timoteo|cartas a timoteo|carta a tito|cartas pastorales|tito","Timoteo y Tito son las cartas pastorales: hablan de ancianos, diáconos, sana doctrina y fidelidad en el ministerio.","1 Ti 3:1-13; 2 Ti 3:16-17; Tit 1:5-9; 2 Ti 4:7"),
E("libro de hebreos|carta a los hebreos|hebreos","Hebreos: Cristo es superior a los ángeles, a Moisés y a los sacerdotes. Su sacrificio único basta, así que perseveramos mirándolo a él.","Heb 1:1-3; Heb 4:14-16; Heb 10:19-25; Heb 12:1-2"),
E("libro de santiago|carta de santiago|santiago","Santiago: una fe viva produce obras. Habla de las pruebas, de la lengua, de los pobres y de la sabiduría. No contradice a Pablo: las obras muestran la fe.","Stg 1:2-4; Stg 2:14-26; Stg 3:1-12"),
E("cartas de pedro|1 pedro|libro de pedro","1 y 2 Pedro: esperanza para los que sufren, llamado a la santidad y advertencia contra los falsos maestros.","1 P 1:3-9; 1 P 2:9-10; 2 P 3:8-9"),
E("cartas de juan|1 juan|primera de juan","1, 2 y 3 Juan enseñan cómo saber que tienes vida eterna: creer en Cristo, andar en la luz y amar a los hermanos.","1 Jn 1:5-9; 1 Jn 4:7-12; 1 Jn 5:13"),
E("apocalipsis|libro de apocalipsis|libro de revelacion","Apocalipsis: la revelación de Jesucristo a su iglesia que sufre. Cristo vence, juzga y hace nuevas todas las cosas.","Ap 1:17-18; Ap 5:9-10; Ap 21:1-5"),
E("pentateuco|libros de moises|torah","El Pentateuco son los cinco primeros libros: Génesis, Éxodo, Levítico, Números y Deuteronomio, tradicionalmente atribuidos a Moisés.","Lc 24:44; Jn 5:46-47"),
E("evangelios|los cuatro evangelios|cuatro evangelios","Los cuatro Evangelios (Mateo, Marcos, Lucas y Juan) cuentan la vida, la muerte y la resurrección de Jesús desde cuatro ángulos.","Lc 1:1-4; Jn 20:30-31"),
["cuantos libros tiene la biblia|libros de la biblia|cuantos libros hay",conMenu(p("La Biblia tiene 66 libros: 39 en el Antiguo Testamento y 27 en el Nuevo.","Lc 24:44; 2 Ti 3:16-17"),I0+1)],

/* ---- Personajes bíblicos (13) ---- */
E("abraham|quien fue abraham|padre de la fe","Abraham: Dios lo llamó a salir de su tierra y le prometió una descendencia y bendición para todas las naciones. Fue declarado justo por creer.","Gn 12:1-3; Gn 15:6; Ro 4:1-5; Heb 11:8-10"),
E("noe|quien fue noe|el arca de noe","Noé halló gracia ante Dios, construyó el arca por fe y se salvó del diluvio. Después Dios hizo un pacto con toda la creación.","Gn 6:8-22; Gn 9:8-17; Heb 11:7; 1 P 3:20"),
E("jacob|quien fue jacob|israel el patriarca","Jacob, nieto de Abraham, luchó con Dios en Peniel y recibió el nombre de Israel. De sus doce hijos salieron las tribus del pueblo.","Gn 25:29-34; Gn 32:22-32; Gn 35:9-12"),
E("moises|quien fue moises","Moisés: salvado de niño, llamado en la zarza ardiente, guía de la liberación y mediador de la ley. Su figura apunta a Cristo.","Ex 3:1-14; Ex 14:21-31; Dt 18:15; Heb 3:1-6"),
E("rahab|quien fue rahab","Rahab, mujer de Jericó, creyó en el Dios de Israel y escondió a los espías. Entró al pueblo de Dios y al linaje de Jesús.","Jos 2:1-14; Heb 11:31; Mt 1:5"),
E("ana madre de samuel|quien fue ana","Ana oró con lágrimas por un hijo y Dios le dio a Samuel. Ella lo entregó al Señor y cantó una alabanza.","1 S 1:9-20; 1 S 2:1-10"),
E("salomon|rey salomon|quien fue salomon","Salomón pidió sabiduría, construyó el templo y escribió proverbios. Terminó apartándose por influencia de sus esposas extranjeras.","1 R 3:5-14; 1 R 6:1; 1 R 11:1-6"),
E("elias|profeta elias|quien fue elias","Elías enfrentó al rey Acab y a los profetas de Baal en el Carmelo. En su desánimo, Dios le habló en un suave susurro.","1 R 18:20-39; 1 R 19:11-13; Stg 5:17-18"),
E("jonas|profeta jonas|quien fue jonas","Jonás huyó de Dios, fue tragado por un gran pez y luego predicó en Nínive. Dios mostró su compasión por una ciudad arrepentida.","Jon 1:1-17; Jon 3:1-10; Jon 4:10-11; Mt 12:39-41"),
E("maria madre de jesus|madre de jesus|la virgen maria|quien fue maria","María, madre de Jesús, fue llamada bienaventurada por creer la palabra de Dios. Para los reformados es modelo de fe y humildad, no mediadora.","Lc 1:26-38; Lc 1:46-55; 1 Ti 2:5"),
E("juan el bautista|quien fue juan el bautista","Juan el Bautista preparó el camino del Señor, llamó al arrepentimiento y señaló a Jesús como el Cordero de Dios.","Mt 3:1-12; Jn 1:29-34; Jn 3:30"),
E("esteban|primer martir|quien fue esteban","Esteban, el primer mártir cristiano, murió proclamando a Cristo y pidiendo perdón por quienes lo apedreaban.","Hch 6:8-15; Hch 7:54-60"),
E("marta y maria|maria de betania|hermanas de lazaro|marta","Marta y María de Betania eran amigas de Jesús: una servía y la otra escuchaba. Jesús enseñó que lo necesario es sentarse a sus pies.","Lc 10:38-42; Jn 11:17-27; Jn 12:1-3"),

/* ---- Historia y Reforma (20) ---- */
["la reforma|reforma protestante|dia de la reforma|31 de octubre",conMenu(p("La Reforma del siglo XVI volvió a la Escritura y al evangelio de la gracia. Comenzó simbólicamente el 31 de octubre de 1517, cuando Lutero publicó las 95 tesis en Wittenberg.","Ro 1:16-17; Ef 2:8-9; Gá 1:6-9"),I0+2)],
E("95 tesis|noventa y cinco tesis|indulgencias","Las 95 tesis (1517) cuestionaban la venta de indulgencias y pedían un debate sobre el arrepentimiento y el perdón. Se difundieron rápido gracias a la imprenta.","Mc 1:15; Ro 3:28; Ef 2:8-9"),
E("dieta de worms|worms","En la Dieta de Worms (1521), Lutero se negó a retractarse mientras no se le mostrara su error con la Escritura y la razón: su conciencia estaba atada a la Palabra de Dios.","Hch 5:29; Is 8:20; 2 Ti 3:16"),
E("lutero|martin lutero|quien fue lutero","Martín Lutero (1483-1546), monje agustino y profesor en Wittenberg, redescubrió que el justo vivirá por la fe. Tradujo la Biblia al alemán y escribió himnos como «Castillo fuerte es nuestro Dios».","Ro 1:17; Gá 3:11; Sal 46:1"),
E("calvino|juan calvino|quien fue calvino","Juan Calvino (1509-1564), pastor y reformador de Ginebra, escribió la Institución de la religión cristiana y comentó casi toda la Biblia. Enseñó la soberanía de Dios y su gloria en todo.","Ro 11:36; 1 Co 10:31; Sal 115:1"),
E("institucion de la religion cristiana|la institucion|institucion de calvino","La Institución de la religión cristiana de Calvino apareció en 1536 y se amplió hasta su edición final de 1559. Es un resumen ordenado de la fe cristiana, centrado en conocer a Dios y conocernos a nosotros mismos.","Pr 9:10; Os 6:3"),
E("zuinglio|ulrico zuinglio|quien fue zuinglio","Ulrico Zuinglio (1484-1531) dirigió la Reforma en Zúrich y predicó libros enteros de la Biblia versículo a versículo. Murió en la batalla de Kappel.","2 Ti 4:2; Neh 8:8"),
E("juan knox|knox|john knox","Juan Knox (c. 1514-1572) fue el reformador de Escocia; su predicación dio forma a la iglesia presbiteriana escocesa.","2 Ti 4:2; Hch 4:19-20"),
E("wycliffe|juan wycliffe|john wycliffe|wiclef","Juan Wycliffe (c. 1328-1384), maestro de Oxford, defendió la autoridad de la Escritura e impulsó la primera traducción completa de la Biblia al inglés. Lo llaman «la estrella de la mañana de la Reforma».","2 Ti 3:16-17; Sal 119:105"),
E("jan hus|juan hus|hus","Jan Hus (c. 1372-1415), predicador de Bohemia, defendió la Escritura y criticó los abusos del clero. Fue quemado vivo en Constanza en 1415.","Hch 5:29; Ap 2:10"),
E("tyndale|william tyndale|guillermo tyndale","William Tyndale tradujo el Nuevo Testamento al inglés para que el pueblo común pudiera leer la Biblia en su idioma. Fue estrangulado y quemado en 1536.","Neh 8:8; Hch 17:11"),
E("agustin|agustin de hipona|san agustin","Agustín de Hipona (354-430) escribió las Confesiones y La ciudad de Dios, y defendió la gracia contra Pelagio. Dijo que nuestro corazón está inquieto hasta que descansa en Dios.","Ef 2:8-9; Sal 62:1; Ro 9:16"),
E("atanasio|atanasio de alejandria","Atanasio de Alejandría (c. 296-373) defendió la deidad de Cristo contra el arrianismo, aun siendo desterrado varias veces.","Jn 1:1-3; Heb 1:3"),
E("jonathan edwards|edwards","Jonathan Edwards (1703-1758), pastor y teólogo de Nueva Inglaterra, impulsó el Gran Despertar y escribió sobre la belleza y la soberanía de Dios.","Sal 27:4; Ro 11:36; Heb 10:31"),
E("spurgeon|charles spurgeon|carlos spurgeon","Charles Spurgeon (1834-1892), bautista reformado, predicó durante décadas en el Tabernáculo Metropolitano de Londres y fue llamado «el príncipe de los predicadores».","1 Co 2:2; 2 Ti 4:2; Ro 1:16"),
E("bunyan|juan bunyan|progreso del peregrino","Juan Bunyan (1628-1688), predicador y escritor puritano, escribió gran parte de El progreso del peregrino durante su encarcelamiento.","Heb 11:13-16; Heb 12:1-2"),
E("john owen|juan owen|owen","John Owen (1616-1683), teólogo puritano y decano de Christ Church en Oxford, escribió sobre la obra de Cristo y la lucha contra el pecado.","Ro 8:13; Heb 9:14"),
E("puritanos|los puritanos|puritano","Los puritanos fueron reformadores ingleses de los siglos XVI y XVII que buscaban una iglesia más fiel a la Escritura y una vida de santidad. Dejaron escritos devocionales muy profundos.","Tit 2:11-14; Heb 12:14"),
E("sinodo de dort|dort|canones de dort","El Sínodo de Dort (1618-1619) respondió a los remonstrantes con los Cánones de Dort, base de los llamados cinco puntos del calvinismo.","Ef 1:4-6; Jn 6:37; Jn 10:28-29"),
E("reina valera|biblia reina valera|biblia del oso|casiodoro de reina","Casiodoro de Reina tradujo la Biblia del Oso (1569) y Cipriano de Valera la revisó (1602). De allí surge la Reina-Valera, base de muchas Biblias en español.","Neh 8:8; Sal 119:130"),

/* ---- Errores y herejías (8) ---- */
E("arrianismo|arrio|los arrianos","Arrio (siglo IV) enseñaba que el Hijo fue creado y que hubo un tiempo en que no existía. El Concilio de Nicea (325) lo rechazó: el Hijo es de la misma esencia que el Padre.","Jn 1:1-3; Jn 10:30; Col 1:15-17; Heb 1:3"),
E("pelagianismo|pelagio|pelagiano","Pelagio negaba el pecado original y enseñaba que el ser humano puede obedecer sin una gracia especial. Agustín lo refutó: sin gracia no podemos, y con gracia Dios nos da lo que manda.","Ro 5:12-19; Ef 2:1-5; Jn 15:5; Fil 2:12-13"),
E("gnosticismo|gnosticos|gnostico","El gnosticismo enseñaba que la salvación llega por un conocimiento secreto y que la materia es mala. La Biblia afirma que Dios creó todo bueno y que Cristo se hizo carne.","Gn 1:31; Jn 1:14; 1 Jn 4:1-3; Col 2:8-9"),
E("docetismo|docetas|jesus parecia humano","El docetismo decía que Jesús solo parecía humano. Los apóstoles insisten en que se hizo carne de verdad: tuvo hambre, lloró y murió.","1 Jn 4:2-3; Jn 1:14; Heb 2:14; 1 Jn 1:1-3"),
E("modalismo|sabelianismo|sabelio|modalista","El modalismo (Sabelio) enseña que Padre, Hijo y Espíritu son tres modos sucesivos de un mismo Dios. La Biblia los muestra a la vez: en el bautismo de Jesús el Padre habla mientras el Espíritu desciende.","Mt 3:16-17; Jn 14:16-17; Mt 28:19; 2 Co 13:14"),
E("nestorianismo|nestorio|nestoriano","Nestorio separaba tanto las dos naturalezas de Cristo que parecía haber dos personas. Éfeso (431) lo condenó y Calcedonia (451) precisó: una persona en dos naturalezas.","Jn 1:14; Fil 2:6-8; Col 2:9; 1 Ti 2:5"),
E("arminianismo|arminio|remonstrantes|arminiano","Jacobo Arminio (1560-1609) y los remonstrantes sostenían que la elección se basa en la fe prevista y que la gracia puede resistirse. Dort respondió con los cinco puntos. Muchos arminianos son hermanos en Cristo: el debate es entre cristianos.","Ef 1:4-5; Ro 9:16; Jn 6:44; Hch 13:48"),
E("antinomianismo|antinomio|legalismo|legalista","Dos errores con la ley: el legalismo cree que obedecer nos gana el favor de Dios; el antinomianismo cree que, por ser salvos por gracia, la ley ya no guía la vida. La Biblia enseña: salvos por gracia para vivir en buenas obras.","Ef 2:8-10; Ro 6:1-2; Gá 2:16; Jn 14:15"),

/* ---- Credos y confesiones (7) ---- */
E("credo de los apostoles|credo apostolico","El Credo de los Apóstoles resume la fe cristiana en tres partes: Padre, Hijo y Espíritu Santo. No lo escribieron los apóstoles, pero recoge su enseñanza y se usa desde hace siglos.","1 Co 15:3-4; Mt 28:19; 1 Ti 3:16"),
E("credo de nicea|credo niceno|concilio de nicea","El Concilio de Nicea (325) afirmó que el Hijo es de la misma esencia que el Padre, contra Arrio. El Credo Niceno-Constantinopolitano (381) confesó también la deidad del Espíritu Santo.","Jn 1:1; Jn 10:30; Hch 5:3-4; 2 Co 3:17"),
E("credo atanasiano","El Credo Atanasiano es una confesión larga sobre la Trinidad y la persona de Cristo. Lleva el nombre de Atanasio, aunque probablemente se escribió después de su época.","Mt 28:19; Jn 1:14; 2 Co 13:14"),
E("concilio de calcedonia","El Concilio de Calcedonia (451) confesó que Cristo es una sola persona en dos naturalezas, divina y humana, sin confusión, cambio, división ni separación.","Jn 1:14; Col 2:9; Fil 2:6-8; Heb 4:15"),
E("catecismo de heidelberg|heidelberg","El Catecismo de Heidelberg (1563) tiene 129 preguntas y comienza con nuestro único consuelo en la vida y en la muerte: pertenecer fielmente a Cristo. Sus tres partes son culpa, gracia y gratitud.","Ro 14:7-8; 1 P 1:18-19; Tit 2:11-14"),
E("confesion de westminster|westminster|catecismo menor","La Confesión de Westminster (1646) y sus Catecismos Mayor y Menor son el estándar de las iglesias presbiterianas. El Catecismo Menor empieza: el fin principal del hombre es glorificar a Dios y gozar de él para siempre.","1 Co 10:31; Sal 73:25-26; Ro 11:36"),
E("confesion bautista de 1689|confesion de 1689|1689","La Confesión Bautista de 1689 sigue de cerca a Westminster, pero enseña el bautismo de los creyentes y el gobierno congregacional. Es el estándar de los bautistas reformados.","Hch 2:41; Hch 8:36-38; Ro 6:3-4"),

/* ---- Doctrinas (14) ---- */
E("angeles|que son los angeles|los angeles","Los ángeles son espíritus creados que sirven a Dios y ayudan a los herederos de la salvación. No se les adora: la adoración es solo para Dios.","Heb 1:13-14; Sal 103:20-21; Col 2:18; Ap 22:8-9"),
E("como es el cielo|que es el cielo|cielo nuevo|tierra nueva|vida eterna","La esperanza cristiana es la presencia de Dios y, al final, cielos nuevos y tierra nueva donde Dios mora con su pueblo, sin llanto ni muerte.","Ap 21:1-5; Jn 14:1-3; Fil 1:23; 2 P 3:13"),
E("infierno|que es el infierno|existe el infierno","La Biblia enseña un juicio justo; el infierno es la separación definitiva de Dios. Cristo advirtió sobre él y por eso vino a salvarnos.","Mt 25:41-46; Jn 3:36; 2 Ts 1:8-9; Ap 20:11-15"),
E("juicio final|juicio de dios|el juicio","Dios juzgará a vivos y muertos por medio de Jesucristo. Quienes están en él no serán condenados.","Hch 17:30-31; 2 Co 5:10; Ro 8:1; Ap 20:11-15"),
E("milenio|escatologia|fin de los tiempos|el fin del mundo","Los reformados difieren sobre el milenio (amilenialismo, premilenialismo y postmilenialismo), pero coinciden en lo central: Cristo vuelve, los muertos resucitan, hay juicio y cielos nuevos.","Ap 20:1-6; 1 Ts 4:16-17; Mt 24:36; Ap 21:1-4"),
E("resurreccion de los muertos|resucitaremos|resurreccion del cuerpo","Los creyentes resucitarán con un cuerpo glorioso como el de Cristo, las primicias de los que durmieron.","1 Co 15:20-23; 1 Co 15:42-44; Fil 3:20-21; Jn 5:28-29"),
E("purgatorio","La Biblia no enseña el purgatorio: la sangre de Cristo limpia de todo pecado y su única ofrenda perfecciona a los santificados. La Reforma lo rechazó.","1 Jn 1:7; Heb 9:27; Heb 10:14; Ro 8:1"),
E("idolatria|imagenes e idolos|que es un idolo","El segundo mandamiento prohíbe hacer imágenes para adorarlas. Idolatría es poner cualquier cosa, buena o mala, en el lugar de Dios.","Ex 20:4-6; 1 Jn 5:21; Col 3:5; Is 44:9-20"),
E("demonios|angeles caidos|guerra espiritual","Los demonios son ángeles caídos que ya fueron derrotados en la cruz. El creyente resiste con la Palabra y la oración, sin miedo.","Jud 6; Col 2:15; Ef 6:10-18; Stg 4:7"),
E("dones espirituales|dones del espiritu|cesacionismo|continuismo","El Espíritu da dones a cada creyente para edificar la iglesia. Los reformados difieren sobre si algunos dones milagrosos continúan hoy.","1 Co 12:4-11; Ro 12:6-8; Ef 4:11-13; 1 P 4:10"),
E("fruto del espiritu|frutos del espiritu","El fruto del Espíritu es amor, gozo, paz, paciencia, amabilidad, bondad, fidelidad, mansedumbre y dominio propio: el carácter que él produce en los que están en Cristo.","Gá 5:22-23; Jn 15:5; Col 3:12-14"),
E("armadura de dios|armadura espiritual","La armadura de Dios: cinturón de la verdad, coraza de justicia, calzado del evangelio, escudo de la fe, yelmo de la salvación y la espada del Espíritu, que es la Palabra.","Ef 6:10-18"),
E("los diez mandamientos|diez mandamientos","Los diez mandamientos:\n1) No tendrás otros dioses.\n2) No harás imágenes para adorarlas.\n3) No tomarás el nombre de Dios en vano.\n4) Acuérdate del día de reposo.\n5) Honra a tu padre y a tu madre.\n6) No matarás.\n7) No cometerás adulterio.\n8) No robarás.\n9) No darás falso testimonio.\n10) No codiciarás.\nJesús los resume en amar a Dios y al prójimo.","Ex 20:1-17; Dt 5:6-21; Mt 22:37-40"),
E("nombres de dios|como se llama dios","Dios se revela con nombres: Elohim (Dios poderoso), Yahvé (el Señor, «Yo soy»), El Shaddai (Dios Todopoderoso) y Adonai (Señor). Cada uno muestra algo de su carácter y de su pacto.","Ex 3:13-15; Gn 17:1; Gn 1:1; Sal 8:1"),

/* ---- Vida cristiana (7) ---- */
E("meditar en la biblia|meditacion biblica|meditar en la palabra|meditar","Meditar en la Biblia es leer despacio un pasaje, repetirlo y preguntarte qué dice de Dios y qué te pide a ti. No es vaciar la mente, sino llenarla de la Palabra.","Sal 1:1-3; Jos 1:8; Sal 119:15-16; Fil 4:8"),
E("tiempo a solas con dios|culto personal|devocional personal|tiempo con dios","Un método sencillo para tu tiempo a solas con Dios: lee un pasaje, pregúntate qué dice, aplícalo a tu día y ora con lo que leíste.","Mc 1:35; Mt 6:6; Sal 5:3"),
E("himnos|cantar himnos|musica cristiana|que cantar|canciones cristianas","Cantar himnos y salmos es una forma bíblica de enseñarnos unos a otros y de alabar a Dios con el corazón. Busca letras fieles a la Escritura que exalten a Cristo.","Col 3:16; Ef 5:19; Sal 100:1-2"),
E("culto familiar|devocional familiar|orar en familia|orar con mis hijos","El culto familiar es un momento breve en casa para leer la Biblia, orar y cantar. Los padres enseñan la Palabra a sus hijos al sentarse, al caminar, al acostarse y al levantarse.","Dt 6:6-9; Jos 24:15; Sal 78:4-7"),
E("ayudar a los pobres|misericordia|obras de misericordia|ayudar al necesitado|dar limosna","Ayudar al pobre y al necesitado es fruto de la fe, no su causa. Dios es padre de los huérfanos y defensor de las viudas, y su pueblo lo imita.","Stg 1:27; Mt 25:34-40; Pr 19:17; Gá 6:10"),
E("matrimonio segun la biblia|que es el matrimonio|esposos y esposas","El matrimonio es un pacto de por vida entre un hombre y una mujer, instituido por Dios, que refleja la unión de Cristo con su iglesia.","Gn 2:24; Mc 10:6-9; Ef 5:22-33; Mal 2:14-16"),
E("criar hijos|educar a los hijos|como criar a mis hijos|crianza","Los hijos son un regalo de Dios: enséñales la Palabra con amor y ejemplo, corrígelos con paciencia sin exasperarlos y ora por su salvación.","Sal 127:3-5; Pr 22:6; Ef 6:4; Dt 6:6-7"),
